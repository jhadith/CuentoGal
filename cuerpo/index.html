<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Little Pony - Inicio</title>
    <link rel="stylesheet" href="/estilos/templateStyles.css">
</head>
<body>
   
    <main>
        <section class="introSection">
            <div class="divImg">
                <a class="bookLink" href="/cuerpo/front_page.html" aria-label="Abrir el cuento">
                    <img src="/imagenes/portadaMini.png" alt="Portada del cuento My Little Pony">
                   
                </a>
            </div>

            <div class="divText">
                
                <div class="divTextContent">
                    <div class="divTextLeft">
                        <h2>La magia de la amistad</h2>
                        <p>
                            Twilight Sparkle y sus amigos comienzan una aventura llena de brillo,
                            misterio y valentia. Juntos descubriran quien se esconde en el lado
                            oscuro de la luna, mientras Celestia y Luna revelan secretos que podrian
                            cambiar la paz de Equestria.
                        </p>
                        
                    </div>
                    <div class="divTextRight">
                        <h2 class="charactersTitle">Personajes</h2>
                        <div class="imageGrid">
                            <figure>
                                <img src="/imagenes/twilight.png" alt="Twilight Sparkle">
                                <figcaption>Twilight Sparkle</figcaption>
                            </figure>
                            <figure>
                                <img src="/imagenes/spiker.png" alt="Spike">
                                <figcaption>Spike</figcaption>
                            </figure>
                            <figure>
                                <img src="/imagenes/luna.png" alt="Princesa Luna">
                                <figcaption>Princesa Luna</figcaption>
                            </figure>
                            <figure>
                                <img src="/imagenes/celestia.png" alt="Princesa Celestia">
                                <figcaption>Princesa Celestia</figcaption>
                            </figure>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
